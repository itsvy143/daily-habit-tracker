<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Habit Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Daily Habit Tracker</h1>
      <p>Build better habits, one day at a time.</p>
    </header>

    <main>
      <section class="dashboard">
        <h2>Today's Progress</h2>

        <div class="progress-container">
          <p id="progress-text">0% Completed</p>

          <div class="progress-bar">
            <div id="progress-fill"></div>
          </div>

          <p id="habit-summary">0 of 0 habits completed</p>
        </div>
      </section>

      <section class="habit-form-section">
        <h2>Add a New Habit</h2>

        <form id="habit-form">
          <div>
            <label for="habit-name">Habit Name</label>
            <input
              type="text"
              id="habit-name"
              placeholder="e.g. Read for 30 minutes"
              required
            />
          </div>

          <button type="submit">Add Habit</button>
        </form>
      </section>

      <section class="habit-list-section">
        <h2>My Daily Habits</h2>

        <div id="habit-list">
          <p id="empty-message">No habits yet. Add your first habit!</p>
        </div>
      </section>
    </main>

    <footer>
      <p>Daily Habit Tracker | Built with HTML, CSS, and JavaScript</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
